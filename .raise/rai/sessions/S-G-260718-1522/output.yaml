patterns:
  - description: "En un guion mosaico con múltiples menciones breves, listar hechos de forma aislada se siente mecánico — cada mención necesita una frase puente narrativa (contraste, causa, paralelismo) con la anterior, aunque eso alargue el guion más allá de la meta de palabras original"
    context: "rockwise-script-short,narrativa,shorts"
    type: process
  - description: "En videos de rock/supergrupos, la audiencia quiere saber de qué banda venía cada integrante y si había rivalidad real entre ellos — omitir esto hace que la mención se sienta vacía aunque el dato principal sea correcto"
    context: "rockwise-script-short,contenido,audiencia"
    type: process
  - description: "Al abrir un video que es parte de una serie/lista, encuadrar como 'primer bloque de N' en vez de presentar el conteo como una selección cerrada y definitiva evita que la audiencia asuma que el canal ya decidió cuáles son 'las' bandas importantes"
    context: "rockwise-script-short,framing,series"
    type: process
  - description: "Para series con votación en comentarios (sin poll nativo de la plataforma), repetir el CTA de 'piensa tus favoritas' al inicio, a la mitad y al final del video mejora la probabilidad de que la audiencia llegue al final con su selección ya decidida"
    context: "rockwise-script-short,cta,votacion"
    type: process
  - description: "Cuando el canal ya tiene contenido corto (no documental completo) sobre un tema que se menciona en un short nuevo, el guion debe decirlo explícitamente como gancho ('ya viste una probadita, la versión completa no existe') en vez de tratarlo como historia repetida o como ya resuelta"
    context: "rockwise-script-short,continuidad,contenido-previo"
    type: process
corrections:
  - what: "El guion inicial del Short 1 listaba cada supergrupo como hecho aislado sin conexión narrativa entre menciones"
    lesson: "El usuario corrigió de inmediato: se sentía mecánico. La corrección aplicada y ahora documentada en el skill es usar frases puente (contraste/causa/paralelismo) entre cada mención, permitiendo que el conteo de palabras crezca si el flujo narrativo lo pide"
  - what: "Se abrió el guion listando 'estas 13 bandas' como si fuera una selección cerrada, y se omitieron integrantes/bandas de origen en varias menciones (ej. Blind Faith sin nombres)"
    lesson: "El usuario señaló que esto da la impresión de lista definitiva y que la audiencia quiere el 'morbo' de saber de dónde venía cada integrante y si había rivalidad — ambas correcciones ahora son requisitos explícitos en rockwise-script-short"
  - what: "Se presentó el guion como listo para grabar sin que las verificaciones de QA Expert y Auditor hubieran completado (los 2 agentes golpearon el límite de sesión sin producir resultado)"
    lesson: "Comunicar de inmediato y con claridad cuando una verificación pedida explícitamente por el usuario no se completó, en vez de dejarlo implícito — el guion quedó marcado con estado pendiente en el propio archivo hasta que se reintente"
