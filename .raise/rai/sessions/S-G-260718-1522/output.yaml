narrative: |
  ## Decisiones
  - El usuario propuso un short de votación (2-3 min) sobre supergrupos de rock para
    validar con la audiencia cuáles 3 (de una lista mayor) merecen convertirse en
    documental completo, antes de invertir producción completa en cada uno.
  - Lista final: 38 supergrupos únicos repartidos en 3 shorts (13/12/13), mezclando
    conocidos y desconocidos por decisión explícita del usuario ("no es un chart,
    es una breve mención"). Se agregó Mad Season (ya tiene doc propio del canal) y
    4 sugerencias mías (The Firm, UK, The Dead Weather, boygenius), todas aceptadas.
  - Cadencia de publicación recomendada: cada 4-5 días entre los 3 shorts, para
    llenar el hueco mientras se termina el documental largo de las 7 canciones de
    Soundgarden, sin canibalizar la atención entre shorts. Deadline interno de
    conteo de votos ~10 días por short, sin anunciar fecha rígida en el guion.
  - Confirmado por búsqueda: término oficial es "supergrupo" (sinónimo aceptado
    "superbanda"), según Wikipedia ES y prensa rock especializada.
  - El usuario pidió endurecer el estándar de verificación factual: mínimo 3 fuentes
    independientes reales por hecho (antes el skill solo pedía 1), y un gate de QA
    Expert + Auditor independientes antes de dar cualquier guion por bueno — ambos
    ahora institucionalizados en los skills, no solo aplicados ad-hoc a este video.

  ## Research
  - Investigación completa de saturación de contenido (qué tan cubiertos están en
    YouTube/TikTok) y ángulo de diferenciación para los 38 supergrupos, con fuentes
    reales (Wikipedia, Louder, Ultimate Classic Rock, AllMusic, Rolling Stone, etc.)
    — ver produccion/supergrupos_rock/investigacion_saturacion.md.
  - Hallazgos de "morbo"/rivalidad verificados y usados en el guion: Bruce y Baker
    (Cream) se odiaban desde la Graham Bond Organisation antes de que Clapton los
    juntara sin saberlo; Crosby suplió a Young en Monterey antes de ser su
    compañero en CSNY; Blind Faith nació de Clapton y Baker regresando a tocar
    juntos meses después de que Cream se separara.
  - Dos correcciones a suposiciones propias, detectadas por verificación real:
    HSAS no incluye a Aynsley Dunbar (el baterista real es Michael Shrieve, ex
    Santana); Apparatjik no incluye a Matt Sweeney (el cuarto integrante es
    Martin Terefe).
  - Dos ganchos de actualidad real 2026 identificados para Short 3: reunión de
    Atoms for Peace (Yorke/Flea, sencillo nuevo enero 2026) y álbum/gira nuevos
    de Puscifer ("Normal Isn't").

  ## Artifactos
  - produccion/supergrupos_rock/investigacion_saturacion.md — research completo
  - produccion/supergrupos_rock/script_short_1.md — guion final del Short 1,
    marcado como PENDIENTE de pasar el gate de QA/auditoría
  - .claude/skills/rockwise-script-short/SKILL.md — nuevo skill (formato corto)
  - .claude/skills/rockwise-qa-audit/SKILL.md — nuevo skill (gate QA Expert + Auditor)
  - .claude/skills/rockwise-research/SKILL.md — editado (3 fuentes mínimo por hecho)

  ## Branch State
  - master, 1 commit ahead de donde empezó la sesión, ya pusheado a origin
    (86edfb3). Working tree limpio en los archivos tocados esta sesión.
  - Se dejó explícitamente sin commitear: 25 archivos rai-*/SKILL.md modificados
    por un sync automático previo a esta conversación, carpeta de backup
    _backup_local_pre_git_sync_20260718 (440K), y varios archivos/carpetas
    duplicados con sufijo "(1)" o "cornell_soundgarden 2" (restos de un conflicto
    de sincronización de Google Drive del cambio de máquina) — decisión
    explicada al usuario, no una omisión silenciosa.
